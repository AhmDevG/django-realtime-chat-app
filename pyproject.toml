[project]
name = "django-realtime-chat-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ma9737149", email = "ahmedashraf3695@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.13.0",
    "channels>=4.3.2",
    "django>=6.1.3",
    "django-cleanup>=9.0.0",
    "django-widget-tweaks>=1.5.1",
    "pillow>=13.0.0",
