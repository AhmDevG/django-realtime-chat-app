<div class="navbar bg-base-100 shadow-sm">
    <div class="container mx-auto flex justify-between items-center px-4">
        <a class="btn btn-ghost text-xl normal-case" href="{% url 'index' %}"
            >Chat app</a
        >

        <div class="flex items-center gap-6">
            <div class="dropdown dropdown-end">
                {% if request.user.is_authenticated %}
                <label
                    tabindex="0"
                    class="btn btn-ghost btn-circle avatar {% if request.user.is_online == True %}avatar-online{% else %}avatar-offline{% endif %}"
                >
                    <div class="w-10 rounded-full">
                        <img
                            src="{{ request.user.profile.url }}"
                            alt="Profile"
                        />
                    </div>
                </label>

                <ul
                    tabindex="0"
                    class="menu menu-sm dropdown-content bg-base-100 rounded-box shadow z-10 mt-3 w-52 p-2"
                >
                    <li class="menu-title text-sm text-white font-bold">
                        {{ request.user.username }}
                    </li>

                    <li><div class="divider my-2"></div></li>

                    <li>
                        <a href="{% url 'profile-detail' request.user.id %}"
                            >Profile</a
                        >
                    </li>

                    <li>
                        <form method="POST" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button
                                type="submit"
                                class="bg-transparent border-0 p-0 text-inherit font-inherit cursor-pointer"
                            >
                                Logout
                            </button>
                        </form>
                    </li>

                    <li>
                        <a href="{% url 'change_password' %}"
                            >Change Password</a
                        >
                    </li>
                    <li>
                        <a href="{% url 'user-update' %}">Update Account</a>
                    </li>
                    <li>
                        <a href="{% url 'user-delete' %}">Delete Account</a>
                    </li>
                </ul>
                {% else %}
                <div class="dropdown dropdown-end">
                    <label tabindex="0" class="btn btn-ghost">
                        Authentication
                    </label>
                    <ul
                        tabindex="0"
                        class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-52"
                    >
                        <li><a href="{% url 'login' %}">Login</a></li>
                        <li><a href="{% url 'sign-up' %}">Sign up</a></li>
                    </ul>
                </div>
                {% endif %}
            </div>

            {% if request.user.is_authenticated %}
            <div class="dropdown dropdown-end">
                <label tabindex="0" class="btn btn-ghost"> Rooms </label>
                <ul
                    tabindex="0"
                    class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-52"
                >
                    <li><a href="{% url 'add_room' %}">Add Room</a></li>
                </ul>
            </div>
            {% endif %}
        </div>
    </div>
</div>
